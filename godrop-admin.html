<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoDrop Archive — 관리자</title>
<style>
  :root{--bg:#0f0f14;--card:#1a1a24;--card-hover:#22223a;--accent:#e8a04c;--accent-dim:rgba(232,160,76,.15);--red:#ff6b6b;--green:#69db7c;--t50:rgba(255,255,255,.92);--t80:rgba(255,255,255,.7);--t60:rgba(255,255,255,.5);--t30:rgba(255,255,255,.25);--t15:rgba(255,255,255,.12);--t08:rgba(255,255,255,.06);--r:12px}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t50);line-height:1.7;min-height:100vh}
  .wrap{max-width:860px;margin:0 auto;padding:20px}

  /* Top Nav */
  .top-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(15,15,20,.95);border-bottom:1px solid var(--t08);position:sticky;top:0;z-index:100;backdrop-filter:blur(8px)}
  .top-nav .nav-home{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t60);text-decoration:none;padding:6px 12px;border-radius:6px;transition:all .15s;border:1px solid transparent}
  .top-nav .nav-home:hover{color:var(--t50);background:var(--t08);border-color:var(--t15)}
  .top-nav .nav-title{font-size:13px;color:var(--t80);font-weight:600;padding:6px 12px}
  .top-nav .nav-title .nav-ver{font-size:10px;color:var(--accent);font-weight:600;margin-left:4px}

  /* Header */
  header{padding:32px 0 24px;text-align:center;border-bottom:1px solid var(--t15)}
  header h1{font-size:24px;font-weight:700;letter-spacing:-.5px;color:var(--t50)}
  header h1 span{color:var(--accent)}
  header .ver{font-size:12px;color:var(--accent);font-weight:600;margin-left:6px;vertical-align:super}
  header p{font-size:14px;color:var(--t60);margin-top:6px}
  .admin-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:4px 12px;border-radius:16px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.2);color:var(--red);font-weight:600;margin-bottom:12px}
  .admin-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 6px rgba(255,107,107,.5)}

  /* Stats */
  .stats-row{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
  .stat-card{flex:1;min-width:120px;background:var(--card);border:1px solid var(--t15);border-radius:10px;padding:16px;text-align:center}
  .stat-num{font-size:28px;font-weight:800;color:var(--accent)}
  .stat-label{font-size:11px;color:var(--t30);font-weight:500;margin-top:2px}

  /* Toolbar */
  .toolbar{display:flex;align-items:center;gap:10px;margin-top:24px;flex-wrap:wrap}
  .toolbar .search-box{flex:1;min-width:200px;padding:9px 14px;border:1px solid var(--t15);border-radius:8px;font-size:13px;font-family:inherit;background:var(--t08);color:var(--t50);transition:border-color .2s}
  .toolbar .search-box:focus{outline:none;border-color:var(--accent)}
  .toolbar .search-box::placeholder{color:var(--t30)}
  .btn-toolbar{padding:9px 16px;border-radius:8px;font-size:12px;font-family:inherit;cursor:pointer;font-weight:600;transition:all .15s;border:1px solid}
  .btn-toolbar.export{border-color:rgba(232,160,76,.2);background:transparent;color:var(--accent)}
  .btn-toolbar.export:hover{background:var(--accent-dim)}
  .btn-toolbar.danger{border-color:rgba(255,107,107,.2);background:transparent;color:var(--red)}
  .btn-toolbar.danger:hover{background:rgba(255,107,107,.08)}

  /* Archive List */
  .archive-list{margin-top:16px;display:flex;flex-direction:column;gap:6px}
  .archive-empty{text-align:center;padding:48px;color:var(--t30);font-size:13px}
  .archive-empty .ae-icon{font-size:40px;margin-bottom:10px;opacity:.4}
  .archive-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);border:1px solid var(--t08);border-radius:10px;transition:all .2s}
  .archive-item:hover{border-color:var(--t15);background:var(--card-hover)}
  .ai-icon{font-size:22px;flex-shrink:0}
  .ai-body{flex:1;min-width:0}
  .ai-top{display:flex;align-items:center;gap:8px;margin-bottom:3px}
  .ai-name{font-size:13px;font-weight:700;color:var(--t80);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ai-size{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--t08);color:var(--t30);font-weight:500;flex-shrink:0}
  .ai-bottom{display:flex;align-items:center;gap:10px}
  .ai-id{font-size:10px;color:var(--t30);font-family:'SF Mono',Consolas,monospace;opacity:.7}
  .ai-time{font-size:11px;color:var(--t30);margin-left:auto;flex-shrink:0}
  .ai-actions{display:flex;gap:6px;flex-shrink:0}
  .ai-btn{font-size:11px;padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:600;transition:all .15s;border:1px solid;font-family:inherit;background:transparent}
  .ai-btn.open{border-color:rgba(232,160,76,.2);color:var(--accent)}
  .ai-btn.open:hover{background:var(--accent-dim)}
  .ai-btn.dl{border-color:var(--t15);color:var(--t60)}
  .ai-btn.dl:hover{background:var(--t08);color:var(--t80)}
  .ai-btn.del{border-color:rgba(255,107,107,.15);color:var(--t30)}
  .ai-btn.del:hover{color:var(--red);background:rgba(255,107,107,.08)}

  /* Footer */
  .footer{text-align:center;padding:24px 20px;font-size:11px;color:var(--t30);border-top:1px solid var(--t08);margin-top:32px;line-height:1.8}

  @media(max-width:640px){
    .wrap{padding:12px}
    header{padding:20px 0 16px}
    header h1{font-size:20px}
    .stats-row{gap:8px}
    .stat-card{padding:12px}
    .stat-num{font-size:22px}
    .toolbar{flex-direction:column}
    .toolbar .search-box{min-width:auto;width:100%}
    .ai-btn.dl{display:none}
    .ai-actions{gap:4px}
  }
</style>
</head>
<body>

<nav class="top-nav">
  <a class="nav-home" href="admin.html">&#x2190; Admin Tools</a>
  <span class="nav-title">GoDrop Archive<span class="nav-ver">v1.0</span></span>
</nav>

<div class="wrap">

<header>
  <div class="admin-badge"><span class="dot"></span>관리자 전용</div>
  <h1><span>Go</span>Drop Archive<sup class="ver">v1.0</sup></h1>
  <p>서류 보관소 관리</p>
</header>

<div class="stats-row">
  <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-label">전체 보관</div></div>
  <div class="stat-card"><div class="stat-num" id="statToday">0</div><div class="stat-label">오늘 투입</div></div>
  <div class="stat-card"><div class="stat-num" id="statSize">0</div><div class="stat-label">총 용량</div></div>
</div>

<div class="toolbar">
  <input class="search-box" id="searchBox" placeholder="파일명 또는 ID로 검색...">
  <button class="btn-toolbar export" id="btnExport">TSV 내보내기</button>
  <button class="btn-toolbar danger" id="btnClearAll">전체 삭제</button>
</div>

<div class="archive-list" id="archiveList">
  <div class="archive-empty">
    <div class="ae-icon">&#x1F4ED;</div>
    아직 보관된 서류가 없습니다
  </div>
</div>

</div>

<div class="footer">
  GoDrop Archive v1.0 &middot; 관리자 전용<br>
  Go Legal Portal &middot; Gowid Legal Tech &middot; 2026
</div>

<script>
/* ── IndexedDB ── */
const DB_NAME = 'godrop_db';
const DB_VERSION = 1;
const STORE_NAME = 'files';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function getAllFiles() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function getFile(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function deleteFile(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function clearAllFiles() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ── State ── */
let archive = [];

const $list = document.getElementById('archiveList');
const $search = document.getElementById('searchBox');

/* ── Init ── */
(async () => {
  archive = JSON.parse(localStorage.getItem('godrop_archive') || '[]');
  updateStats();
  render(archive);
})();

$search.addEventListener('input', () => {
  const q = $search.value.toLowerCase().trim();
  const filtered = q ? archive.filter(a => (a.name + ' ' + a.id).toLowerCase().includes(q)) : archive;
  render(filtered);
});

/* ── Stats ── */
function updateStats() {
  const today = new Date().toISOString().slice(0, 10);
  const todayCount = archive.filter(a => a.timestamp && a.timestamp.startsWith(today)).length;
  const totalSize = archive.reduce((sum, a) => sum + (a.size || 0), 0);
  document.getElementById('statTotal').textContent = archive.length;
  document.getElementById('statToday').textContent = todayCount;
  document.getElementById('statSize').textContent = formatSize(totalSize);
}

/* ── Render ── */
function render(list) {
  if (list.length === 0) {
    $list.innerHTML = '<div class="archive-empty"><div class="ae-icon">&#x1F4ED;</div>' + (archive.length === 0 ? '아직 보관된 서류가 없습니다' : '검색 결과가 없습니다') + '</div>';
    return;
  }
  $list.innerHTML = list.map(a => `
    <div class="archive-item">
      <span class="ai-icon">${fileIcon(a.name)}</span>
      <div class="ai-body">
        <div class="ai-top">
          <span class="ai-name">${esc(a.name)}</span>
          <span class="ai-size">${formatSize(a.size)}</span>
        </div>
        <div class="ai-bottom">
          <span class="ai-id">${a.id}</span>
          <span class="ai-time">${a.dateStr || ''}</span>
        </div>
      </div>
      <div class="ai-actions">
        <button class="ai-btn open" onclick="openFile('${a.id}')">열기</button>
        <button class="ai-btn dl" onclick="downloadFile('${a.id}')">다운로드</button>
        <button class="ai-btn del" onclick="removeItem('${a.id}')">&times;</button>
      </div>
    </div>
  `).join('');
}

/* ── Open File ── */
window.openFile = async function(id) {
  const file = await getFile(id);
  if (!file || !file.data) return alert('파일 데이터를 찾을 수 없습니다.\n(다른 브라우저 또는 시크릿 모드에서 투입한 파일일 수 있습니다.)');
  const blob = new Blob([file.data], { type: file.type || 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
  setTimeout(() => URL.revokeObjectURL(url), 60000);
};

/* ── Download File ── */
window.downloadFile = async function(id) {
  const file = await getFile(id);
  if (!file || !file.data) return alert('파일 데이터를 찾을 수 없습니다.');
  const blob = new Blob([file.data], { type: file.type || 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = file.name;
  link.click();
  URL.revokeObjectURL(url);
};

/* ── Delete ── */
window.removeItem = async function(id) {
  if (!confirm('이 항목을 삭제하시겠습니까?')) return;
  await deleteFile(id);
  archive = archive.filter(a => a.id !== id);
  localStorage.setItem('godrop_archive', JSON.stringify(archive));
  updateStats();
  render(archive);
};

document.getElementById('btnClearAll').addEventListener('click', async () => {
  if (!confirm(`전체 ${archive.length}건을 모두 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.`)) return;
  await clearAllFiles();
  archive = [];
  localStorage.setItem('godrop_archive', JSON.stringify(archive));
  updateStats();
  render(archive);
});

/* ── TSV Export ── */
document.getElementById('btnExport').addEventListener('click', () => {
  if (archive.length === 0) return alert('내보낼 데이터가 없습니다.');
  const header = ['ID','파일명','크기','일시'].join('\t');
  const rows = archive.map(a => [a.id, a.name, formatSize(a.size), a.dateStr||''].join('\t'));
  const tsv = [header, ...rows].join('\n');
  const blob = new Blob(['\uFEFF'+tsv], {type:'text/tab-separated-values;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  const d = new Date();
  link.download = `GoDrop_Archive_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.tsv`;
  link.click();
  URL.revokeObjectURL(url);
});

/* ── Helpers ── */
function formatSize(bytes) {
  if (!bytes) return '0 B';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  if (bytes < 1073741824) return (bytes/1048576).toFixed(1) + ' MB';
  return (bytes/1073741824).toFixed(1) + ' GB';
}
function fileIcon(name) {
  const ext = (name||'').split('.').pop().toLowerCase();
  const map = {pdf:'&#x1F4D5;',doc:'&#x1F4D8;',docx:'&#x1F4D8;',xls:'&#x1F4D7;',xlsx:'&#x1F4D7;',hwp:'&#x1F4D9;',hwpx:'&#x1F4D9;',jpg:'&#x1F5BC;',jpeg:'&#x1F5BC;',png:'&#x1F5BC;',tif:'&#x1F5BC;',tiff:'&#x1F5BC;'};
  return map[ext] || '&#x1F4C4;';
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
</script>
<script src="auth-gate.js"></script>
</body>
</html>
