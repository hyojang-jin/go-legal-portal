<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go_parse v1.0 — 외부 리걸 AI 스레드 파서</title>
<style>
  :root{--bg:#0f0f14;--card:#1a1a24;--card-hover:#22223a;--accent:#e8a04c;--accent-dim:rgba(232,160,76,.15);--red:#ff6b6b;--red-bg:rgba(255,107,107,.12);--yellow:#ffd43b;--yellow-bg:rgba(255,212,59,.10);--green:#69db7c;--green-bg:rgba(105,219,124,.10);--t50:rgba(255,255,255,.92);--t80:rgba(255,255,255,.7);--t60:rgba(255,255,255,.5);--t30:rgba(255,255,255,.25);--t15:rgba(255,255,255,.12);--t08:rgba(255,255,255,.06);--r:12px}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t50);line-height:1.7;min-height:100vh}
  .wrap{max-width:860px;margin:0 auto;padding:20px}

  /* Top Nav */
  .top-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(15,15,20,.95);border-bottom:1px solid var(--t08);position:sticky;top:0;z-index:100;backdrop-filter:blur(8px)}
  .top-nav .nav-home{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t60);text-decoration:none;padding:6px 12px;border-radius:6px;transition:all .15s;border:1px solid transparent}
  .top-nav .nav-home:hover{color:var(--t50);background:var(--t08);border-color:var(--t15)}
  .top-nav .nav-title{font-size:13px;color:var(--t80);font-weight:600;cursor:pointer;padding:6px 12px;border-radius:6px;transition:all .15s;border:1px solid transparent;user-select:none}
  .top-nav .nav-title:hover{color:var(--accent);background:var(--accent-dim);border-color:rgba(232,160,76,.2)}
  .top-nav .nav-title .nav-ver{font-size:10px;color:var(--accent);font-weight:600;margin-left:4px}

  /* Header */
  header{padding:32px 0;text-align:center;border-bottom:1px solid var(--t15)}
  header h1{font-size:24px;font-weight:700;letter-spacing:-.5px;color:var(--t50)}
  header h1 span{color:var(--accent)}
  header .ver{font-size:12px;color:var(--accent);font-weight:600;margin-left:6px;vertical-align:super}
  header p{font-size:13px;color:var(--t60);margin-top:6px}

  /* Input Card */
  .input-card{background:var(--card);border:1px solid var(--t15);border-radius:var(--r);padding:28px;margin-top:24px}
  .input-card h2{font-size:16px;font-weight:600;margin-bottom:4px;color:var(--t50)}
  .input-card .hint{font-size:13px;color:var(--t60);margin-bottom:16px}

  /* Source Selector */
  .source-row{display:flex;gap:8px;margin-bottom:16px}
  .source-btn{flex:1;padding:10px 16px;border:1.5px solid var(--t15);border-radius:10px;background:transparent;color:var(--t60);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;text-align:center}
  .source-btn:hover{border-color:var(--t30);color:var(--t80)}
  .source-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
  .source-btn .src-icon{font-size:18px;display:block;margin-bottom:4px}

  textarea.main-input{width:100%;min-height:200px;background:var(--t08);border:1.5px solid var(--t15);border-radius:10px;padding:14px;font-size:14px;font-family:inherit;color:var(--t50);line-height:1.6;resize:vertical;transition:border-color .2s}
  textarea.main-input:focus{outline:none;border-color:var(--accent)}
  textarea.main-input::placeholder{color:var(--t30)}

  /* Context input */
  .context-row{margin-top:12px}
  .context-row input{width:100%;padding:10px 14px;border:1.5px solid var(--t15);border-radius:8px;font-size:13px;font-family:inherit;background:var(--t08);color:var(--t50)}
  .context-row input:focus{outline:none;border-color:var(--accent)}
  .context-row .ctx-hint{font-size:11px;color:var(--t30);margin-top:4px}

  /* Button */
  .btn-row{display:flex;gap:8px;margin-top:16px}
  .btn-parse{flex:1;padding:14px;background:var(--accent);color:#111;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.3px;font-family:inherit}
  .btn-parse:hover{opacity:.9;box-shadow:0 0 20px rgba(232,160,76,.3)}
  .btn-parse:disabled{background:var(--t15);color:var(--t30);cursor:not-allowed;box-shadow:none}
  .btn-add{padding:14px 20px;background:var(--t08);border:1px solid var(--t15);border-radius:10px;font-size:14px;cursor:pointer;color:var(--t60);transition:all .15s;font-family:inherit}
  .btn-add:hover{background:var(--t15);color:var(--t80)}
  .btn-add:disabled{opacity:.4;cursor:not-allowed}

  /* Loading */
  .loading{text-align:center;padding:40px;margin-top:24px}
  .spinner{width:40px;height:40px;border:3px solid var(--t15);border-top:3px solid var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading p{font-size:14px;color:var(--t60)}

  /* Result */
  .result{margin-top:24px;animation:fadeIn .4s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

  /* Parsed Card */
  .parsed-card{background:var(--card);border:1px solid var(--t15);border-radius:var(--r);padding:20px;margin-bottom:12px}
  .parsed-card .pc-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .parsed-card .pc-source{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:600}
  .parsed-card .pc-source.elbox{background:rgba(116,192,252,.12);color:#74c0fc;border:1px solid rgba(116,192,252,.2)}
  .parsed-card .pc-source.superlawyer{background:rgba(160,140,240,.12);color:#a08cf0;border:1px solid rgba(160,140,240,.2)}
  .parsed-card .pc-source.other{background:var(--t08);color:var(--t60);border:1px solid var(--t15)}
  .parsed-card .pc-date{font-size:11px;color:var(--t30);margin-left:auto}
  .parsed-card .pc-title{font-size:16px;font-weight:700;color:var(--t50);margin-bottom:12px;line-height:1.5}

  .pc-field{margin-bottom:10px}
  .pc-field .pc-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);font-weight:600;margin-bottom:4px}
  .pc-field .pc-value{font-size:13px;color:var(--t80);line-height:1.7;padding:8px 12px;background:var(--t08);border-radius:8px}
  .pc-field .pc-value.legal-ref{border-left:3px solid var(--accent);background:rgba(232,160,76,.05)}

  .pc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .pc-tag{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:500}
  .pc-tag.axis{background:rgba(124,140,240,.12);color:#7c8cf0;border:1px solid rgba(124,140,240,.2)}
  .pc-tag.contract{background:rgba(105,219,124,.12);color:var(--green);border:1px solid rgba(105,219,124,.2)}
  .pc-tag.risk-red{background:var(--red-bg);color:var(--red);border:1px solid rgba(255,107,107,.2)}
  .pc-tag.risk-yellow{background:var(--yellow-bg);color:var(--yellow);border:1px solid rgba(255,212,59,.2)}
  .pc-tag.risk-green{background:var(--green-bg);color:var(--green);border:1px solid rgba(105,219,124,.2)}

  /* Archive Section */
  .archive-section{margin-top:32px;border-top:1px solid var(--t15);padding-top:24px}
  .archive-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .archive-header h3{font-size:16px;font-weight:600;color:var(--t50)}
  .archive-header .count{font-size:12px;color:var(--accent);background:var(--accent-dim);padding:3px 10px;border-radius:12px;font-weight:600}
  .archive-actions{display:flex;gap:8px}
  .btn-export{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
  .btn-tsv{background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent)}
  .btn-tsv:hover{background:var(--accent);color:#111}
  .btn-json{background:var(--t08);border:1px solid var(--t15);color:var(--t60)}
  .btn-json:hover{background:var(--t15);color:var(--t80)}
  .btn-clear{background:var(--red-bg);border:1px solid rgba(255,107,107,.2);color:var(--red)}
  .btn-clear:hover{background:var(--red);color:#111}

  /* Mini cards in archive */
  .mini-card{background:var(--card);border:1px solid var(--t15);border-radius:8px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;transition:border-color .15s}
  .mini-card:hover{border-color:var(--t30)}
  .mini-card .mc-source{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600;flex-shrink:0}
  .mini-card .mc-source.elbox{background:rgba(116,192,252,.12);color:#74c0fc}
  .mini-card .mc-source.superlawyer{background:rgba(160,140,240,.12);color:#a08cf0}
  .mini-card .mc-source.other{background:var(--t08);color:var(--t60)}
  .mini-card .mc-title{flex:1;font-size:13px;color:var(--t80);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini-card .mc-axes{display:flex;gap:4px}
  .mini-card .mc-ax{font-size:9px;padding:2px 6px;border-radius:4px;background:var(--t08);color:var(--t30)}
  .mini-card .mc-delete{font-size:12px;color:var(--t30);cursor:pointer;padding:4px 8px;border-radius:4px;transition:all .15s;background:transparent;border:none}
  .mini-card .mc-delete:hover{color:var(--red);background:var(--red-bg)}

  /* Copy feedback */
  .copy-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#111;padding:10px 24px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200}
  .copy-toast.show{opacity:1}

  .error-box{margin-top:24px;padding:16px 20px;background:var(--red-bg);border:1px solid rgba(255,107,107,.25);border-radius:var(--r);font-size:14px;color:var(--red)}

  .disclaimer{margin-top:20px;font-size:11px;color:var(--t30);text-align:center;line-height:1.6}
  .reset-btn{margin-top:16px;display:block;text-align:center;color:var(--t60);font-size:14px;cursor:pointer;text-decoration:underline;transition:color .15s}
  .reset-btn:hover{color:var(--accent)}

  .hidden{display:none!important}

  @media(max-width:600px){.wrap{padding:12px}.input-card{padding:18px}.source-row{flex-direction:column}}
</style>
</head>
<body>
<nav class="top-nav">
  <a class="nav-home" href="index.html">&#x2190; Go Legal Portal</a>
  <span class="nav-title" onclick="resetAll()">Go_parse<span class="nav-ver">v1.0</span></span>
</nav>
<header>
  <h1><span>Go_</span>parse<span class="ver">v1.0</span></h1>
  <p>엘박스 · 슈퍼로이어 스레드를 붙여넣으면 구조화된 선례 데이터로 변환합니다</p>
</header>
<div class="wrap">
  <div class="input-card">
    <h2>출처를 선택하세요</h2>
    <p class="hint">어떤 리걸 AI에서 가져온 대화인지 선택하면 파싱 정확도가 올라갑니다.</p>
    <div class="source-row">
      <button class="source-btn active" data-source="elbox" onclick="selectSource(this)">
        <span class="src-icon">&#x1F4D8;</span>엘박스
      </button>
      <button class="source-btn" data-source="superlawyer" onclick="selectSource(this)">
        <span class="src-icon">&#x2696;</span>슈퍼로이어
      </button>
      <button class="source-btn" data-source="other" onclick="selectSource(this)">
        <span class="src-icon">&#x1F4DD;</span>기타 (직접 입력)
      </button>
    </div>

    <h2>스레드 내용을 붙여넣으세요</h2>
    <p class="hint">엘박스/슈퍼로이어에서 주고받은 대화 전체를 복사하여 아래에 붙여 넣으세요. 여러 스레드를 나누어 파싱할 수 있습니다.</p>
    <textarea class="main-input" id="threadInput" placeholder="예시:&#10;&#10;[질문] FUEL 수수료를 연 20%에서 25%로 올리려고 합니다. 대부업법상 이자 해당 여부가 궁금합니다.&#10;&#10;[답변] 고위드의 FUEL 서비스는 형식상 '정산 대행'이지만, 실질적으로 신용공여에 해당할 수 있습니다...&#10;&#10;[추가 질문] 그러면 수수료율 상한이 있나요?&#10;&#10;[답변] 대부업법 제8조에 따르면..." oninput="toggleBtn()"></textarea>

    <div class="context-row">
      <input type="text" id="contextInput" placeholder="(선택) 안건 배경 메모 — 예: 2024년 3분기 FUEL 수수료 인상 검토 건" />
      <p class="ctx-hint">추가 맥락을 입력하면 파싱 시 안건 분류가 더 정확해집니다</p>
    </div>

    <div class="btn-row">
      <button class="btn-parse" id="parseBtn" onclick="parseThread()" disabled>파싱 시작</button>
      <button class="btn-add" id="addBtn" onclick="addToArchive()" disabled title="현재 파싱 결과를 아카이브에 추가">+ 아카이브에 추가</button>
    </div>
  </div>

  <div id="resultArea"></div>

  <!-- Archive -->
  <div class="archive-section" id="archiveSection">
    <div class="archive-header">
      <h3>파싱 아카이브</h3>
      <span class="count" id="archiveCount">0건</span>
    </div>
    <div class="archive-actions">
      <button class="btn-export btn-tsv" onclick="exportTSV()">Google Sheets용 TSV 복사</button>
      <button class="btn-export btn-json" onclick="exportJSON()">JSON 다운로드</button>
      <button class="btn-export btn-clear" onclick="clearArchive()">전체 삭제</button>
    </div>
    <div id="archiveList" style="margin-top:12px"></div>
  </div>
</div>

<div class="copy-toast" id="copyToast">클립보드에 복사되었습니다</div>

<script>
// ========== STATE ==========
let currentSource = 'elbox';
let currentParsed = null;
let archive = JSON.parse(localStorage.getItem('goparse_archive') || '[]');

// ========== SYSTEM PROMPT ==========
const PARSE_PROMPT = `당신은 고위드(Gowid) 법무팀의 리걸 데이터 아키텍트입니다.
외부 리걸 AI 서비스(엘박스, 슈퍼로이어 등)에서 주고받은 대화 스레드를 구조화된 법무 선례 데이터로 변환하는 것이 임무입니다.

## 고위드 사업 맥락
- 핀테크 기업, 금융 인허가 없이 금융유사서비스 운영
- FUEL(선정산/한도), VWS(구매대행/위탁판매), ENGINE(렌탈/할부), IT구독, 글로벌정산, 카드(PLCC)
- 5대 Grey Zone: 구조(structure), 무허가(license), 데이터(data), 거래(transaction), 약관(terms)

## 표준 계약서 코드 (참조 매칭용)
일반[G]: G00~G08, GS03~GS05
FUEL[F]: F53F(현행), F83D(현행), F61A, F87A, F01~F03, F11, FS02~FS05
VWS[V]: V01, V02B(현행), V03C(현행), VS01C~VS04, V04, V11B(현행)
ENGINE[E]: E01~E03
구독[S]: S02~S05

## 출력 형식 (JSON, 반드시 준수)
{
  "title": "안건 제목 (15자 이내, 핵심 키워드 중심)",
  "summary": "안건 요약 (3-5문장, 질문자의 핵심 고민과 AI의 주요 답변 요지를 포함)",
  "questionCore": "질문자가 알고 싶었던 핵심 포인트 1문장",
  "answerCore": "AI가 내린 핵심 결론 1문장",
  "legalBasis": ["관련 법령/조항 목록 (예: 대부업법 제8조, 약관규제법 제6조)"],
  "riskAxes": ["해당되는 5대 축 (structure/license/data/transaction/terms)"],
  "riskLevel": "high | medium | low",
  "relatedContracts": ["관련 표준 계약서 코드 (예: F53F, G06B). 없으면 빈 배열"],
  "tags": ["분류 태그 3-5개 (예: FUEL, 수수료, 이자성, 대부업법)"],
  "actionTaken": "이 스레드 기반으로 실제 취해진/취해야 할 조치 (추론 가능하면 기재, 불명이면 '확인 필요')",
  "blindSpot": "스레드에서 다루지 않았지만 추가 검토가 필요한 숨은 쟁점 1가지",
  "originalDate": "대화 날짜 (추정 가능하면 YYYY-MM-DD, 불명이면 빈 문자열)",
  "source": "출처 플랫폼명"
}

## 규칙
- 스레드 내용에서 고위드 맥락에 해당하는 부분은 반드시 5대 Grey Zone 축과 매핑
- legalBasis는 스레드에 언급된 법령만 포함 (추측 추가 금지)
- relatedContracts는 스레드 맥락에서 관련성이 높은 코드만 매칭
- riskLevel: high=법적 위반 가능성 높음, medium=확인 필요, low=현재 구조상 문제 낮음
- source 필드에는 제공된 출처 플랫폼명을 그대로 기재`;

// ========== API ==========
const DEFAULT_KEY = '';
const GEMINI_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent';

async function callAI(userText) {
  const key = localStorage.getItem('gowid_gemini_key') || DEFAULT_KEY;
  if (!key) throw new Error('API 키가 설정되지 않았습니다.');

  const res = await fetch(`${GEMINI_URL}?key=${key}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      system_instruction: { parts: [{ text: PARSE_PROMPT }] },
      contents: [{ parts: [{ text: userText }] }],
      generationConfig: {
        temperature: 0.15,
        maxOutputTokens: 4096,
        responseMimeType: "application/json"
      }
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    if (res.status === 401 || res.status === 403) throw new Error('API 키가 유효하지 않습니다.');
    if (res.status === 429) throw new Error('요청 한도 초과. 잠시 후 다시 시도해 주세요.');
    throw new Error(err.error?.message || `API 오류 (${res.status})`);
  }

  const data = await res.json();
  const candidate = data.candidates?.[0];
  const text = candidate?.content?.parts?.[0]?.text;
  if (!text) throw new Error('AI 응답을 받지 못했습니다.');
  try { return JSON.parse(text); } catch (e) { throw new Error('JSON 파싱 실패. 다시 시도해 주세요.'); }
}

// ========== UI ==========
function selectSource(btn) {
  document.querySelectorAll('.source-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentSource = btn.dataset.source;
}

function toggleBtn() {
  const hasText = !!document.getElementById('threadInput').value.trim();
  document.getElementById('parseBtn').disabled = !hasText;
}

const SOURCE_LABELS = { elbox: '엘박스', superlawyer: '슈퍼로이어', other: '기타' };

async function parseThread() {
  const threadText = document.getElementById('threadInput').value.trim();
  if (!threadText) return;
  const context = document.getElementById('contextInput').value.trim();

  let combined = `[출처] ${SOURCE_LABELS[currentSource] || currentSource}\n`;
  if (context) combined += `[배경] ${context}\n`;
  combined += `\n[스레드 내용]\n${threadText}`;

  const btn = document.getElementById('parseBtn');
  btn.disabled = true;
  btn.textContent = '파싱 중...';
  document.getElementById('addBtn').disabled = true;

  document.getElementById('resultArea').innerHTML = `<div class="loading"><div class="spinner"></div><p>스레드를 분석하고 구조화하고 있습니다...</p></div>`;

  try {
    const result = await callAI(combined);
    result.source = SOURCE_LABELS[currentSource] || currentSource;
    result._parsedAt = new Date().toISOString();
    currentParsed = result;
    renderParsed(result);
    document.getElementById('addBtn').disabled = false;
  } catch (e) {
    document.getElementById('resultArea').innerHTML = `<div class="error-box">${escHtml(e.message)}</div>`;
    currentParsed = null;
  } finally {
    btn.disabled = false;
    btn.textContent = '파싱 시작';
  }
}

function renderParsed(r) {
  const srcCls = currentSource === 'elbox' ? 'elbox' : currentSource === 'superlawyer' ? 'superlawyer' : 'other';
  const riskCls = r.riskLevel === 'high' ? 'risk-red' : r.riskLevel === 'medium' ? 'risk-yellow' : 'risk-green';
  const riskLabel = r.riskLevel === 'high' ? 'HIGH' : r.riskLevel === 'medium' ? 'MED' : 'LOW';

  const axisLabels = { structure:'구조', license:'무허가', data:'데이터', transaction:'거래', terms:'약관' };

  let html = `<div class="result"><div class="parsed-card">
    <div class="pc-header">
      <span class="pc-source ${srcCls}">${escHtml(r.source)}</span>
      <span class="pc-tag ${riskCls}">${riskLabel}</span>
      ${r.originalDate ? `<span class="pc-date">${escHtml(r.originalDate)}</span>` : ''}
    </div>
    <div class="pc-title">${escHtml(r.title || '')}</div>

    <div class="pc-field">
      <div class="pc-label">안건 요약</div>
      <div class="pc-value">${escHtml(r.summary || '')}</div>
    </div>

    <div class="pc-field">
      <div class="pc-label">핵심 질문</div>
      <div class="pc-value">${escHtml(r.questionCore || '')}</div>
    </div>

    <div class="pc-field">
      <div class="pc-label">핵심 결론</div>
      <div class="pc-value">${escHtml(r.answerCore || '')}</div>
    </div>

    <div class="pc-field">
      <div class="pc-label">법령 근거</div>
      <div class="pc-value legal-ref">${(r.legalBasis || []).map(l => escHtml(l)).join('<br>') || '—'}</div>
    </div>

    <div class="pc-field">
      <div class="pc-label">숨은 쟁점</div>
      <div class="pc-value">${escHtml(r.blindSpot || '')}</div>
    </div>

    <div class="pc-field">
      <div class="pc-label">조치 사항</div>
      <div class="pc-value">${escHtml(r.actionTaken || '')}</div>
    </div>

    <div class="pc-tags">
      ${(r.riskAxes || []).map(a => `<span class="pc-tag axis">${escHtml(axisLabels[a] || a)}</span>`).join('')}
      ${(r.relatedContracts || []).map(c => `<span class="pc-tag contract">${escHtml(c)}</span>`).join('')}
      ${(r.tags || []).map(t => `<span class="pc-tag" style="background:var(--t08);color:var(--t60);border:1px solid var(--t15)">${escHtml(t)}</span>`).join('')}
    </div>
  </div></div>`;

  document.getElementById('resultArea').innerHTML = html;
  document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ========== ARCHIVE ==========
function addToArchive() {
  if (!currentParsed) return;
  archive.push(currentParsed);
  saveArchive();
  renderArchive();
  // Reset input for next thread
  document.getElementById('threadInput').value = '';
  document.getElementById('contextInput').value = '';
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('addBtn').disabled = true;
  currentParsed = null;
  toggleBtn();
  showToast('아카이브에 추가되었습니다');
}

function saveArchive() {
  localStorage.setItem('goparse_archive', JSON.stringify(archive));
}

function renderArchive() {
  document.getElementById('archiveCount').textContent = `${archive.length}건`;
  const list = document.getElementById('archiveList');
  if (archive.length === 0) {
    list.innerHTML = '<p style="font-size:12px;color:var(--t30);text-align:center;padding:20px">아직 파싱된 선례가 없습니다. 스레드를 파싱한 후 아카이브에 추가하세요.</p>';
    return;
  }

  const axisLabels = { structure:'구조', license:'무허가', data:'데이터', transaction:'거래', terms:'약관' };
  list.innerHTML = archive.map((item, i) => {
    const srcCls = item.source === '엘박스' ? 'elbox' : item.source === '슈퍼로이어' ? 'superlawyer' : 'other';
    return `<div class="mini-card">
      <span class="mc-source ${srcCls}">${escHtml(item.source)}</span>
      <span class="mc-title">${escHtml(item.title || '(제목 없음)')}</span>
      <div class="mc-axes">${(item.riskAxes || []).slice(0,3).map(a => `<span class="mc-ax">${axisLabels[a] || a}</span>`).join('')}</div>
      <button class="mc-delete" onclick="removeFromArchive(${i})" title="삭제">&times;</button>
    </div>`;
  }).join('');
}

function removeFromArchive(index) {
  archive.splice(index, 1);
  saveArchive();
  renderArchive();
}

function clearArchive() {
  if (!confirm('아카이브를 전체 삭제하시겠습니까?')) return;
  archive = [];
  saveArchive();
  renderArchive();
}

// ========== EXPORT ==========
function exportTSV() {
  if (archive.length === 0) { showToast('내보낼 데이터가 없습니다'); return; }

  const headers = ['출처','안건제목','안건요약','핵심질문','핵심결론','법령근거','리스크축','리스크레벨','관련계약코드','태그','조치사항','숨은쟁점','날짜'];
  const rows = archive.map(item => [
    item.source || '',
    item.title || '',
    item.summary || '',
    item.questionCore || '',
    item.answerCore || '',
    (item.legalBasis || []).join(', '),
    (item.riskAxes || []).join(', '),
    item.riskLevel || '',
    (item.relatedContracts || []).join(', '),
    (item.tags || []).join(', '),
    item.actionTaken || '',
    item.blindSpot || '',
    item.originalDate || ''
  ]);

  const tsv = [headers.join('\t'), ...rows.map(r => r.map(cell => String(cell).replace(/[\t\n\r]/g, ' ')).join('\t'))].join('\n');

  navigator.clipboard.writeText(tsv).then(() => {
    showToast(`${archive.length}건 TSV 복사 완료 — Google Sheets에 Ctrl+V로 붙여넣기`);
  }).catch(() => {
    // Fallback: download as file
    downloadFile('goparse_export.tsv', tsv, 'text/tab-separated-values');
  });
}

function exportJSON() {
  if (archive.length === 0) { showToast('내보낼 데이터가 없습니다'); return; }
  const json = JSON.stringify(archive, null, 2);
  downloadFile('goparse_export.json', json, 'application/json');
  showToast(`${archive.length}건 JSON 다운로드 완료`);
}

function downloadFile(filename, content, mimeType) {
  const blob = new Blob([content], { type: mimeType + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ========== UTILS ==========
function escHtml(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showToast(msg) {
  const toast = document.getElementById('copyToast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

function resetAll() {
  document.getElementById('threadInput').value = '';
  document.getElementById('contextInput').value = '';
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('addBtn').disabled = true;
  currentParsed = null;
  document.getElementById('threadInput').focus();
  toggleBtn();
}

// ========== INIT ==========
window.addEventListener('DOMContentLoaded', () => {
  toggleBtn();
  renderArchive();
});

document.getElementById('threadInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    if (!document.getElementById('parseBtn').disabled) parseThread();
  }
});
</script>
